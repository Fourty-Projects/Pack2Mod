# Build + release multi-versions (jars par version MC/Forge + zip global pour Modrinth).
#
# Déclenchement :
#   - push sur main     -> build les versions ACTIVÉES (vérif continue)
#   - tag git "vX.Y.Z"  -> build + GitHub Release (zip + jars)
#   - manuel (Actions)  -> build uniquement (artefacts téléchargeables)
#
# Une entrée = un couple (Minecraft / Forge / Java / pack_format).
# `enabled: true`  -> buildée par la CI (steps skippés sinon, sans échec).
# `enabled: false` -> ignorée : il faut d'abord porter les sources (voir ci-dessous).
#
# Stratégie : tout ce qui peut compiler avec les sources actuelles est testé
# par la CI (c'est elle qui tranche). Les vieilles ères restent disabled :
# pas de branche = checkout impossible, et toolchain incompatible de toute
# façon (voir tableau des versions).
#
# Branches de port existantes :
#   - mc-1.20.2plus : API ResourcesSupplier 1.20.2-1.20.4 (openPrimary/openFull).
#   - mc-1.20.5plus : API 1.20.5+ (PackLocationInfo/PackSelectionConfig, plus de
#     flag boolean, PathPackResources sans isBuiltin).
#
# Note : forcedpacks/ est git-ignoré par défaut (packs privés).
# Pour une release AVEC packs : `git add -f src/main/resources/forcedpacks/<pack>`
# sur la branche/le tag releasé, ou renseigner les packs autrement.
# Les packs embarqués doivent déclarer le pack_format de la version ciblée
# (sinon le jeu les marque "incompatible", même si required les force quand même).

name: Build all versions

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build ${{ matrix.mc }} (Forge ${{ matrix.forge }}, Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ================ 1.7 - 1.12 (ForgeGradle 2, Java 8, MCP) =================
          # Portage complet requis (branche mc-<version>) : laissez enabled: false.
          - {mc: '1.7.10', forge: '10.13.4.1614', java: '8',  pack_format: '1', mc_range: '[1.7.10,1.8)',  forge_range: '[10,)', ref: 'mc-1.7.10',  enabled: false}
          - {mc: '1.8.9',  forge: '11.15.1.2318', java: '8',  pack_format: '1', mc_range: '[1.8.9,1.9)',   forge_range: '[11,)', ref: 'mc-1.8.9',   enabled: false}
          - {mc: '1.9.4',  forge: '12.17.0.2317', java: '8',  pack_format: '2', mc_range: '[1.9.4,1.10)',  forge_range: '[12,)', ref: 'mc-1.9.4',   enabled: false}
          - {mc: '1.10.2', forge: '12.18.3.2511', java: '8',  pack_format: '2', mc_range: '[1.10.2,1.11)', forge_range: '[12,)', ref: 'mc-1.10.2',  enabled: false}
          - {mc: '1.11.2', forge: '13.20.1.2588', java: '8',  pack_format: '3', mc_range: '[1.11.2,1.12)', forge_range: '[13,)', ref: 'mc-1.11.2',  enabled: false}
          - {mc: '1.12.2', forge: '14.23.5.2859', java: '8',  pack_format: '3', mc_range: '[1.12.2,1.13)', forge_range: '[14,)', ref: 'mc-1.12.2',  enabled: false}
          # ================ 1.13 - 1.16 (FG3/FG4, Java 8) =================
          - {mc: '1.13.2', forge: '25.0.223',      java: '8',  pack_format: '4', mc_range: '[1.13.2,1.14)', forge_range: '[25,)', ref: 'mc-1.13.2',  enabled: false}
          - {mc: '1.14.4', forge: '28.2.26',       java: '8',  pack_format: '4', mc_range: '[1.14.4,1.15)', forge_range: '[28,)', ref: 'mc-1.14.4',  enabled: false}
          - {mc: '1.15.2', forge: '31.2.57',       java: '8',  pack_format: '5', mc_range: '[1.15.2,1.16)', forge_range: '[31,)', ref: 'mc-1.15.2',  enabled: false}
          - {mc: '1.16.5', forge: '36.2.34',       java: '8',  pack_format: '6', mc_range: '[1.16.5,1.17)', forge_range: '[36,)', ref: 'mc-1.16.5',  enabled: false}
          # ================ 1.17 - 1.19 (FG5, Java 16/17) =================
          - {mc: '1.17.1', forge: '37.1.1',        java: '16', pack_format: '7',  mc_range: '[1.17.1,1.18)',   forge_range: '[37,)', ref: '', enabled: true}
          - {mc: '1.18.2', forge: '40.3.0',        java: '17', pack_format: '9',  mc_range: '[1.18.2,1.19)',   forge_range: '[40,)', ref: '', enabled: true}
          - {mc: '1.19.2', forge: '43.5.0',        java: '17', pack_format: '9',  mc_range: '[1.19.2,1.19.3)', forge_range: '[43,)', ref: '', enabled: true}
          - {mc: '1.19.4', forge: '45.4.0',        java: '17', pack_format: '13', mc_range: '[1.19.4,1.20)',   forge_range: '[45,)', ref: '', enabled: true}
          # ================ 1.20.x (ForgeGradle 6, sources portées) =================
          - {mc: '1.20.1', forge: '47.4.18',       java: '17', pack_format: '15', mc_range: '[1.20.1,1.20.2)', forge_range: '[47,)', ref: '',        enabled: true}
          - {mc: '1.20.2', forge: '48.1.0',        java: '17', pack_format: '18', mc_range: '[1.20.2,1.20.3)', forge_range: '[48,)', ref: 'mc-1.20.2plus', enabled: true}
          - {mc: '1.20.4', forge: '49.2.13',       java: '17', pack_format: '22', mc_range: '[1.20.4,1.20.5)', forge_range: '[49,)', ref: 'mc-1.20.2plus', enabled: true}
          - {mc: '1.20.6', forge: '50.2.14',       java: '21', pack_format: '32', mc_range: '[1.20.6,1.21)',   forge_range: '[50,)', ref: 'mc-1.20.5plus', enabled: true}
          # ================ 1.21+ / 26.x (toolchain à valider au portage) =================
          - {mc: '1.21.1', forge: '52.1.20',       java: '21', pack_format: '34', mc_range: '[1.21.1,1.21.2)', forge_range: '[52,)', ref: 'mc-1.21', enabled: true}
          - {mc: '1.21.4', forge: '54.1.22',       java: '21', pack_format: '48', mc_range: '[1.21.4,1.21.5)', forge_range: '[54,)', ref: 'mc-1.21', enabled: true}
          - {mc: '26.3',   forge: '66.1.0',        java: '21', pack_format: '?',  mc_range: '[26.3,27)',       forge_range: '[66,)', ref: '', enabled: true} # toolchain à valider : la CI tranche

    steps:
      - name: Checkout ${{ matrix.ref || github.ref_name }}
        if: ${{ matrix.enabled }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref == '' && github.ref || matrix.ref }}

      - name: Set up Java ${{ matrix.java }}
        if: ${{ matrix.enabled }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'gradle'

      - name: Check embedded packs
        if: ${{ matrix.enabled }}
        run: |
          echo "Contenu de forcedpacks/ :"
          ls -R src/main/resources/forcedpacks || true
          COUNT=$(find src/main/resources/forcedpacks -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::forcedpacks/ est vide (packs git-ignorés ?) : le jar ne forcera aucun pack."
          fi

      - name: Resolve mod version
        if: ${{ matrix.enabled }}
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "mod_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "mod_version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: ${{ matrix.enabled }}
        run: |
          chmod +x gradlew
          ./gradlew build \
            -Pmod_version='${{ steps.version.outputs.mod_version }}' \
            -Pminecraft_version='${{ matrix.mc }}' \
            -Pminecraft_version_range='${{ matrix.mc_range }}' \
            -Pforge_version='${{ matrix.forge }}' \
            -Pforge_version_range='${{ matrix.forge_range }}' \
            -Pforge_loader_range='${{ matrix.forge_range }}' \
            -Ppack_format='${{ matrix.pack_format }}' \
            -Pjava_version='${{ matrix.java }}'

      - name: Rename jar per version
        if: ${{ matrix.enabled }}
        run: |
          mkdir -p dist
          cp build/libs/pack2mod-*.jar "dist/pack2mod-${{ steps.version.outputs.mod_version }}-${{ matrix.mc }}-forge-${{ matrix.forge }}.jar"
          ls -la dist/

      - name: Upload jar artifact
        if: ${{ matrix.enabled }}
        uses: actions/upload-artifact@v4
        with:
          name: pack2mod-${{ matrix.mc }}-forge-${{ matrix.forge }}
          path: dist/*.jar

  package:
    name: Zip global + Release
    # Tourne même si des versions échouent : on zippe ce qui a buildé.
    if: always()
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve names
        id: names
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "mod_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "mod_version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          ls -R dist

      - name: Build Modrinth zip (toutes versions)
        run: |
          cd dist
          zip -r "pack2mod-${{ steps.names.outputs.mod_version }}-all-versions.zip" . -x '*.zip'
          ls -la
          cd ..

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack2mod-${{ steps.names.outputs.tag }}-all-versions
          path: dist/*.zip

      - name: GitHub Release (tags uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.names.outputs.tag }}" \
            --title "Pack2Mod ${{ steps.names.outputs.tag }}" \
            --notes "Jars par version (nommés pack2mod-<mod>-<mc>-forge-<forge>.jar, à uploader un par un sur Modrinth/CurseForge avec la bonne version du jeu) + zip global toutes-versions." \
            dist/*
