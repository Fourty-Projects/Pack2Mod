# Build + release (Minecraft 1.20.1 / Forge 47.4.x / Java 17).
#
# - push sur main ou manuel : build + jar en artefact.
# - tag git "vX.Y.Z"        : build + GitHub Release avec le jar
#   (a uploader sur Modrinth/CurseForge en version 1.20.1).

name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build 1.20.1 (Forge 47.4.18, Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Check embedded packs
        run: |
          echo "Contenu de forcedpacks/ :"
          ls -R src/main/resources/forcedpacks || true
          COUNT=$(find src/main/resources/forcedpacks -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::forcedpacks/ est vide (packs git-ignorés ?) : le jar ne forcera aucun pack."
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Rename jar
        run: |
          mkdir -p dist
          cp build/libs/pack2mod-*.jar "dist/pack2mod-1.20.1.jar"
          ls -la dist/

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack2mod-1.20.1
          path: dist/*.jar

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: GitHub Release (tags uniquement)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Pack2Mod ${{ github.ref_name }}" \
            --notes "Modrinth/CurseForge : uploader le jar en version Minecraft 1.20.1, Forge 47.4.x." \
            dist/*
