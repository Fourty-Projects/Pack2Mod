buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:${project.findProperty('forgegradle_version') ?: '6.0.29'}"
    }
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'net.minecraftforge.gradle'

version = project.findProperty('mod_version') ?: '1.0.0-dev'
group = 'com.pack2mod'

def mcVersion = project.findProperty('minecraft_version') ?: '1.20.1'
def forgeVersion = project.findProperty('forge_version') ?: '47.4.18'
def javaVersion = (project.findProperty('java_version') ?: '17') as int

base {
    archivesName = 'pack2mod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)

minecraft {
    mappings channel: 'official', version: mcVersion

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'pack2mod'
            mods {
                pack2mod {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'pack2mod'
            mods {
                pack2mod {
                    source sourceSets.main
                }
            }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'pack2mod', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                pack2mod {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mcVersion}-${forgeVersion}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: mcVersion,
        minecraft_version_range: project.findProperty('minecraft_version_range') ?: '[1.20.1,1.21)',
        forge_version: forgeVersion,
        forge_version_range: project.findProperty('forge_version_range') ?: '[47,)',
        forge_loader_range: project.findProperty('forge_loader_range') ?: '[47,)',
        pack_format: (project.findProperty('pack_format') ?: '15'),
        mod_id: 'pack2mod',
        mod_version: project.version.toString()
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
