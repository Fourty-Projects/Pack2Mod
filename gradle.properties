org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Version cible par defaut (surchargée par la CI via -P...).
# Ajouter une version = ajouter une entrée dans .github/workflows/build.yml
# + vérifier que les sources compilent (les API changent selon les versions MC).
mod_version=1.0.0-dev
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.18
forge_version_range=[47,)
forge_loader_range=[47,)
pack_format=15
java_version=17
# Majeur ForgeGradle : 6.0.x pour la ligne 1.20.x (les vieilles ères utilisent
# leur propre build.gradle sur leur branche, pas cette propriété).
forgegradle_version=6.0.29
